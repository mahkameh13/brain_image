hydra:
  run:
    dir: logs/hydra/run_${job_id}_${run_id}

lightning_logger:
  _target_: lightning.pytorch.loggers.WandbLogger
  project: unimodal3D
  save_dir: logs/
  log_model: False
  id: run_${run_id}

lightning_seed:
  _target_: lightning.pytorch.seed_everything
  seed: 1234
  workers: True

trainer:
  _target_: lightning.pytorch.Trainer
  max_epochs: 2000
  deterministic: True
  num_nodes: 1
  devices: 1
  accelerator: auto
  strategy: ddp_find_unused_parameters_true
  accumulate_grad_batches: 1
  precision: 16-mixed
  profiler: simple
  # gradient_clip_val: 1
  callbacks:
    - _target_: lightning.pytorch.callbacks.EarlyStopping
      monitor: valid_loss
      min_delta: 1e-3
      patience: 100
      mode: min
    - _target_: lightning.pytorch.callbacks.ModelCheckpoint
      monitor: valid_loss
      dirpath: logs/models
      filename: best_model_${run_id}
    - _target_: unimodal_ae.wandb.callbacks3D.LogReconstructedInputs
      num_images: 8
      num_epochs: 50
    # - _target_: unimodal_ae.wandb.callbacks.LogInterpolatedInputs
    #   num_images: 8
    #   num_epochs: 50
    - _target_: unimodal_ae.wandb.callbacks3D.LogDatasetSplits
      num_images: 8
    - _target_: unimodal_ae.wandb.callbacks3D.LogDatasetInformation


datamodule:
  _target_: unimodal_ae.data.data.MRIDataModule
  datasets:
    - _target_: unimodal_ae.data.data.MRIDataset
      path: /home/galella/Documents/data/IXI/derivatives/datasets/anat/3D/T1_old.h5
      transforms:
        _target_: torchvision.transforms.Compose
        transforms:
          - _target_: monai.transforms.intensity.array.ScaleIntensity
            minv: 0.0
            maxv: 1.0
  params_split:
    seed: 1234
    ratio: [0.9, 0.05, 0.05]
  params_dataloaders:
    train:
      batch_size: 8
      num_workers: 2
      pin_memory: True
    valid:
      batch_size: 8
      num_workers: 2
      pin_memory: True
    test:
      batch_size: 8
      num_workers: 2
      pin_memory: True

model:
  _target_: unimodal_ae.models.ddpm.DDPM
  autoencoder:
    weights: logs/models/best_model_cngneg.ckpt
    config: logs/hydra/run_92235_cngneg/.hydra/config.yaml
  params:
    - spatial_dims: 3
    - in_channels: 2
    - out_channels: 1
    - num_res_blocks: 1
    - num_channels: [32, 64]
    - attention_levels: [False, True]
    - num_head_channels: [0, 64]
  scheduler:
    _target_: generative.networks.schedulers.DDPMScheduler
    num_train_timesteps: 100
    schedule: scaled_linear_beta
    beta_start: 0.0015
    beta_end: 0.0195
  optimizer:
    _target_: torch.optim.Adam
    _partial_: True
    lr: 1e-4
    betas: [0.9, 0.999]
  
