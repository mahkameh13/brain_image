
hydra:
  run:
    dir: logs/hydra/run_${job_id}_${run_id}

lightning_logger:
  _target_: lightning.pytorch.loggers.WandbLogger
  project: unimodal3D
  save_dir: logs/
  log_model: False
  id: run_${run_id}

lightning_seed:
  _target_: lightning.pytorch.seed_everything
  seed: 1234
  workers: True

trainer:
  _target_: lightning.pytorch.Trainer
  max_epochs: 1000
  deterministic: True
  num_nodes: 1
  devices: 1
  accelerator: auto
  strategy: ddp
  accumulate_grad_batches: 1
  precision: 16-mixed
  callbacks:
    - _target_: lightning.pytorch.callbacks.EarlyStopping
      monitor: valid_loss
      min_delta: 1e-3
      patience: 1000
      mode: min
    - _target_: lightning.pytorch.callbacks.ModelCheckpoint
      monitor: valid_loss
      dirpath: logs/models
      filename: best_model_${run_id}
    - _target_: unimodal_ae.wandb.callbacks3D.LogReconstructedInputs
      num_images: 8
      num_epochs: 100
    # - _target_: unimodal_ae.wandb.callbacks3D.LogInterpolatedInputs
    #   num_images: 8
    #   num_epochs: 100
    - _target_: unimodal_ae.wandb.callbacks3D.LogDatasetSplits
      num_images: 8
    - _target_: unimodal_ae.wandb.callbacks3D.LogDatasetInformation


datamodule:
  _target_: unimodal_ae.data.data.MRIDataModule
  datasets:
    - _target_: unimodal_ae.data.data.MRIDataset
      path: /home/galella/Documents/data/IXI/derivatives/datasets/anat/3D/T1.h5
  params_split:
    seed: 1234
    ratio: [0.9, 0.05, 0.05]
  params_dataloaders:
    train:
      batch_size: 64
      num_workers: 4
      pin_memory: True
    valid:
      batch_size: 29
      num_workers: 4
      pin_memory: True
    test:
      batch_size: 29
      num_workers: 4
      pin_memory: True

model:
  _target_: unimodal_ae.models.autoencoder.Autoencoder
  params:
    - spatial_dims: 3
    - in_shape: [128, 128, 128]
    - in_channels: 1
    - out_channels: 1
    - latent_size: 128 
    - channels: [128, 256, 512, 1024, 2048]
    - strides: [2, 2, 2, 2, 2]
    - kernel_size: [3, 3, 3]
    - up_kernel_size: [3, 3, 3]
    - act: RELU
    - norm: INSTANCE
    - dropout: Null
    - bias: True
  optimizer:
    _target_: torch.optim.Adam
    _partial_: True
    lr: 1e-4
    betas: [0.9, 0.999]
  lr_scheduler:
    _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
    _partial_: True
    factor: 0.1
    patience: 50