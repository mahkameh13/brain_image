hydra:
  run:
    dir: logs/hydra/run_${job_id}_${run_id}

lightning_logger:
  _target_: lightning.pytorch.loggers.WandbLogger
  project: unimodal3D
  save_dir: logs/
  log_model: False
  id: run_${run_id}

lightning_seed:
  _target_: lightning.pytorch.seed_everything
  seed: 1234
  workers: True

trainer:
  _target_: lightning.pytorch.Trainer
  max_epochs: 1000
  deterministic: True
  num_nodes: 1
  devices: 2
  accelerator: auto
  strategy: ddp_find_unused_parameters_true
  accumulate_grad_batches: 1
  precision: 16-mixed
  profiler: simple
  # gradient_clip_val: 1
  callbacks:
    - _target_: lightning.pytorch.callbacks.EarlyStopping
      monitor: valid_loss_mse
      min_delta: 1e-3
      patience: 1000
      mode: min
    - _target_: lightning.pytorch.callbacks.ModelCheckpoint
      monitor: valid_loss_mse
      dirpath: logs/models
      filename: best_model_${run_id}
    - _target_: unimodal_ae.wandb.callbacks3D.LogReconstructedInputs
      num_images: 8
      num_epochs: 50
      use_sigmoid: False
    - _target_: unimodal_ae.wandb.callbacks3D.LogDatasetSplits
      num_images: 8
    #  - _target_: unimodal_ae.wandb.callbacks3D.LogDatasetInformation

dataset:
  seed: 1234
  ratio: [0.9, 0.05, 0.05]
  data:
    _target_: unimodal_ae.data.datasets.MRIDataset
    _partial_: True
    path: /home/galella/Documents/data/IXI/derivatives/datasets/anat/3D/T1.h5
  transforms:
    train:
      _target_: torchvision.transforms.Compose
      transforms:
        - _target_: monai.transforms.intensity.array.ScaleIntensity
          minv: 0.0
          maxv: 1.0
        # - _target_: monai.transforms.RandAdjustContrast
        #   prob: 0.1
        #   gamma: [0.5, 3]
    valid:
      _target_: torchvision.transforms.Compose
      transforms:
        - _target_: monai.transforms.intensity.array.ScaleIntensity
          minv: 0.0
          maxv: 1.0
    test:
      _target_: torchvision.transforms.Compose
      transforms:
        - _target_: monai.transforms.intensity.array.ScaleIntensity
          minv: 0.0
          maxv: 1.0

datamodule:
  _target_: unimodal_ae.data.datamodules.MRIDataModule
  params:
    train:
      batch_size: 8
      num_workers: 4
      pin_memory: True
    valid:
      batch_size: 8
      num_workers: 4
      pin_memory: True
    test:
      batch_size: 8
      num_workers: 4
      pin_memory: True

model:
  _target_: unimodal_ae.models.vae_gan.VAEGAN
  beta: 1.0
  gamma: 1.0
  params:
    vae:
    - spatial_dims: 3
    - in_shape: [160, 224, 160]
    - in_channels: 1
    - out_channels: 1
    - latent_size: 128  # 128 
    - channels: [128, 256, 512, 1024, 2048]
    - strides: [2, 2, 2, 2, 2]
    - kernel_size: 3
    - up_kernel_size: 3
    - act: RELU
    - norm: INSTANCE
    - dropout: Null
    - bias: True
    discriminator:
    - in_shape: [1, 160, 224, 160]
    - channels: [128, 256, 512, 1024]
    - strides: [2, 2, 2, 2]
    - kernel_size: 5
    - num_res_units: 0
    - act:
      - LEAKYRELU
      - {"negative_slope": 0.2}
    - norm: BATCH
    - dropout: Null
    - bias: True
    - last_act: Null
  optimizer:
    encoder:
      _target_: torch.optim.Adam
      _partial_: True
      lr: 1e-5
      betas: [0.9, 0.999]
    decoder:
      _target_: torch.optim.Adam
      _partial_: True
      lr: 1e-5
      betas: [0.9, 0.999]
    discriminator:
      _target_: torch.optim.SGD  #torch.optim.Adam
      _partial_: True
      lr: 5e-5
      # betas: [0.9, 0.999]
